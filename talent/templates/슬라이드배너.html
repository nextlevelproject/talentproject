<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배너</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fff;
      margin: 0;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 90%;
      max-width: 900px;
      overflow: hidden;
    }
    .slider {
      display: flex;
      transition: transform 0.3s ease-in-out;
    }
    .menu-item {
      min-width: 80px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: 0 10px;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .menu-item .icon-box {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .menu-item .icon-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .menu-item span {
      font-size: 14px;
      color: #333;
    }
    .menu-item:hover {
      transform: scale(1.1);
      opacity: 0.8;
    }
    .nav-btn {
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      width: 35px;
      height: 35px;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s;
    }
    .nav-btn:hover {
      background: #ddd;
    }
  </style>
</head>
<body>
  <button class="nav-btn" id="prev">&#10094;</button>
  <div class="slider-container" id="slider-container">
    <div class="slider" id="slider">

      </div><span>청소</span></div>
      <div class="menu-item"><div class="icon3">
        <img src="C:/JYD/Flask/project/talentproject/talent/static/image/설치.png">
      </div><span>설치</span></div>
      <div class="menu-item"><div class="icon4">
        <img src="C:/JYD/Flask/project/talentproject/talent/static/image/인테리어.png">
      </div><span>인테리어</span></div>
      <div class="menu-item"><div class="icon5">
        <img src="C:/JYD/Flask/project/talentproject/talent/static/image/수리.jpg">
      </div><span>수리</span></div>
      <div class="menu-item"><div class="icon6">
        <img src="C:/JYD/Flask/project/talentproject/talent/static/image/이벤트.jpg">

      <div class="menu-item"><div class="icon7">
        <img src="C:/JYD/Flask/project/talentproject/talent/static/image/취업.jpg">

      <div class="menu-item"><div class="icon8">

      <div class="menu-item"><div class="icon10">

        <img src="C:/JYD/Flask/project/talentproject/talent/static/image/숙박시설.jpg">
      </div><span>숙박시설</span></div>
    </div>
  </div>
  <button class="nav-btn" id="next">&#10095;</button>

  <script>
    const slider = document.getElementById('slider');
    const sliderContainer = document.getElementById('slider-container');
    const prev = document.getElementById('prev');
    const next = document.getElementById('next');
    let scrollAmount = 0;
    const scrollStep = 120;
    let autoSlide;

    function slide(direction) {
      scrollAmount += direction * scrollStep;
      slider.style.transform = `translateX(${scrollAmount}px)`;
    }

    function startAutoSlide() {
      autoSlide = setInterval(() => slide(-1), 3000); // 3초마다 왼쪽으로 이동
    }

    function stopAutoSlide() {
      clearInterval(autoSlide);
    }

    next.addEventListener('click', () => slide(-1));
    prev.addEventListener('click', () => slide(1));

    // 마우스 올리면 자동 슬라이드 멈춤
    sliderContainer.addEventListener('mouseenter', stopAutoSlide);
    sliderContainer.addEventListener('mouseleave', startAutoSlide);

    startAutoSlide();
  </script>
</body>
</html>
