{% extends 'base.html' %}
{% block content %}

<style>
    .container {
        max-width: 400px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
        text-align: center;
        color: #333;
    }

    label {
        display: block;
        margin: 15px 0 5px;
    }

    input[type="text"], input[type="email"] {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border-radius: 4px;
        border: 1px solid #ccc;
    }

    button {
        width: 100%;
        padding: 10px;
        background-color: #4CAF50;
        color: white;
        border: none;
        margin-top: 20px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 16px;
    }

    button:hover {
        background-color: #45a049;
    }

    .result {
        margin-top: 20px;
        text-align: center;
        color: #333;
    }
</style>

<div class="container">
    <h2>아이디 찾기</h2>
    <form id="findIdForm">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" required>

        <label for="email">이메일</label>
        <input type="email" id="email" name="email" required>

        <button type="submit">아이디 찾기</button>
    </form>

    <div class="result" id="resultBox"></div>
</div>

<script>
    // 여기가 올바른 자바스크립트 코드야!
    const form = document.getElementById('findIdForm');
    const resultBox = document.getElementById('resultBox');

    form.addEventListener('submit', function (event) {
        event.preventDefault(); // 폼 기본 제출 동작 막기

        const name = form.name.value.trim();
        const email = form.email.value.trim();

        // 백엔드(Flask)로 데이터 전송 요청 (fetch API 사용)
        fetch('/auth/find_id', {
            method: 'POST', // POST 방식으로 요청
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded', // 폼 데이터 형식
            },
            // 이름과 이메일 데이터를 URL-encoded 형식으로 body에 담기
            body: `name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`
        })
        .then(response => response.json()) // 서버 응답을 JSON 형식으로 파싱
        .then(data => {
            // 서버에서 받은 'data' 객체 확인
            if (data.success) { // 성공적으로 아이디를 찾았으면
                resultBox.textContent = `당신의 아이디는: ${data.userid}입니다.`;
            } else { // 아이디를 찾지 못했으면
                resultBox.textContent = data.message;
            }
        })
        .catch(error => { // 요청 중 오류 발생 시
            resultBox.textContent = "오류가 발생했습니다. 다시 시도해주세요.";
            console.error('Error:', error); // 콘솔에 오류 메시지 출력
        });
    });
</script>

{% endblock %}
