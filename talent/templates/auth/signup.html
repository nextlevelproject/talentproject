{% extends 'base.html' %}
{% block content %}
    <div class="container">
        <h5 class="my-3 border-bottom pb-2">회원 가입</h5>

        <form method="post">
            {% include 'form_errors.html' %}
            <div class="mb-3">
                <label for="id">아이디</label>
                <div class="input-group">
                    <input type="text" name="id" id="id" class="form-control" placeholder="아이디 입력 (6~20자)"
                           value="{{ form.id.data or '' }}">
                    <button type="button" class="btn btn-outline-secondary">중복 확인</button>
                </div>
                <!-- 여기에 유효성 검사 메시지를 조건부로 표시 -->
                <small class="text-danger">사용할 수 없는 아이디입니다</small>
            </div>

            <div class="mb-3">
                <label for="password1">비밀번호</label>
                <input type="password" name="password1" id="password1" class="form-control"
                       placeholder="문자, 숫자, 특수문자 포함 8~20자"
                       value="{{ form.password1.data or '' }}">
                <small class="text-danger">20자 이내의 비밀번호를 입력해주세요</small>
            </div>

            <div class="mb-3">
                <label for="password2">비밀번호 확인</label>
                <input type="password" name="password2" id="password2" class="form-control"
                       placeholder="비밀번호 재입력"
                       value="{{ form.password2.data or '' }}">
                <small class="text-danger">비밀번호가 일치하지 않습니다</small>
            </div>

            <div class="mb-3">
                <label for="password2">비밀번호 확인</label>
                <input type="password" name="password2" id="password2" class="form-control"
                       value="{{ form.password2.data or '' }}">
            </div>
            <div class="mb-3">
                <label for="username">사용자 이름</label>
                <input type="text" name="username" id="username" class="form-control"
                       value="{{ form.username.data or '' }}">
            </div>
            <div class="mb-3">
                <label for="tel_number">전화번호</label>
                <input type="text" name="tel_number" id="tel_number" class="form-control"
                       value="{{ form.tel_number.data or '' }}">
            </div>
            <div class="mb-3">
                <label for="birthday">생년월일</label>
                <div class="row">
                    <div class="col">
                        <select name="birth_year" class="form-select">
                            <option value="">년도</option>
                            {% for year in range(1950, 2024) %}
                                <option value="{{ year }}">{{ year }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col">
                        <select name="birth_month" class="form-select">
                            <option value="">월</option>
                            {% for month in range(1, 13) %}
                                <option value="{{ month }}">{{ month }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col">
                        <select name="birth_day" class="form-select">
                            <option value="">일</option>
                            {% for day in range(1, 32) %}
                                <option value="{{ day }}">{{ day }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label for="email">이메일 주소</label>
                <div class="input-group">
                    <input type="text" name="email" id="email" class="form-control" placeholder="이메일 주소"
                           value="{{ form.email.data or '' }}">
                    <span class="input-group-text">@naver.com</span>
                    <span class="input-group-text">@daum.net</span>
                    <span class="input-group-text">@google.com</span>
                    <span class="input-group-text">@kakao.com</span>
                </div>
            </div>
            <div class="mb-3 text-center">
                <button type="submit" class="btn btn-primary">가입하기</button>
                <a href="/" class="btn btn-warning">가입취소</a>
            </div>
        </form>
    </div>
{% endblock %}
