{% extends 'base.html' %}
{% block content %}
<div class="container">
  <h2 class="text-center my-4">비밀번호 찾기</h2>
  <div class="row justify-content-center">
    <div class="col-md-6">
      <form id="findPasswordForm" method="POST">
        <div class="mb-3">
          <label for="email">가입한 이메일 주소</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">비밀번호 재설정 링크 받기</button>
      </form>
      <div class="mt-3 text-center">
        <a href="{{ url_for('auth.login') }}">로그인 페이지로 돌아가기</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
