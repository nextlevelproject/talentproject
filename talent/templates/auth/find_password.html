{% extends 'base.html' %}
{% block content %}
<div class="container">
  <h2 class="text-center my-4">비밀번호 찾기</h2>
  <div class="row justify-content-center">
    <div class="col-md-6">
      <form method="POST" action="{{ url_for('auth.find_password') }}">
        {{ form.hidden_tag() }}

        <div class="mb-3">
          {{ form.email.label }}
          {{ form.email }}
          {% for error in form.email.errors %}
            <div class="text-danger small">{{ error }}</div>
          {% endfor %}
        </div>

        {{ form.submit }}
      </form>
      <div class="mt-3 text-center">
        <a href="{{ url_for('auth.login') }}">로그인 페이지로 돌아가기</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
