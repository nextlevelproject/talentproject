{% extends "ctgr_base.html" %}

{% block ctgr_content %}
<div class="container py-5" style="max-width: 1000px;">
    <form method="post">
        <div class="mb-4 p-4 rounded bg-light shadow-sm">
            {% include 'form_errors.html' %}
            <h5 class="fw-semibold text-secondary mb-3">금융</h5>
            <div class="row">
                {% for choice in form.finance %}
                <div class="col-md-6 mb-2">
                    <div class="form-check">
                        {{ choice(class="form-check-input") }}
                        <label class="form-check-label ms-1">{{ choice.label.text }}</label>
                    </div>
                </div>
                {% endfor %}
            </div>

            <h5 class="fw-semibold text-secondary mt-4 mb-3">법률</h5>
            <div class="row">
                {% for choice in form.law %}
                <div class="col-md-6 mb-2">
                    <div class="form-check">
                        {{ choice(class="form-check-input") }}
                        <label class="form-check-label ms-1">{{ choice.label.text }}</label>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-success px-4">제출하기</button>
        </div>
    </form>
</div>
{% endblock %}
