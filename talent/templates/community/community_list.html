{% extends "base.html" %}

{% block content %}
<h1>Community</h1>
{% for post in posts %}
    <div class="post-preview">
        <a href="{{ url_for('community.post_detail', post_id=post.id) }}">
            <h2>{{ post.title }}</h2>
        </a>
        <small>
            Posted: {{ post.create_date.strftime('%Y-%m-%d %H:%M') }} |
            Likes: {{ post.likes|length }} |
            Comments: {{ post.comments|length }}
        </small>
    </div>
{% else %}
    <p>No posts yet!</p>
{% endfor %}
{% endblock %}
