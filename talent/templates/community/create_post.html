{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='community/create_post.css') }}">
{% endblock %}

{% block content %}
<div class="container">

    <!-- Page Title -->
    <h2 class="mb-4">글쓰기</h2>

    <!-- Create Post Form -->
    <form method="POST" enctype="multipart/form-data" class="create-post-form">

        <!-- Category Dropdown -->
        <div class="form-group mb-3">
            <label for="category" class="form-label">카테고리 선택</label>
            <div class="custom-select-wrapper">
                <select name="category" id="category" class="input-field custom-select" required>
                    <option value="" disabled selected>--카테고리를 선택하세요--</option>
                    <option value="고수에게묻다">고수에게묻다</option>
                    <option value="고수노하우">고수노하우</option>
                    <option value="함께해요">함께해요</option>
                    <option value="고수소식">고수소식</option>
                    <option value="숨고이야기">숨고이야기</option>
                </select>
            </div>
        </div>

        <!-- Title -->
        <input type="text" name="title" class="input-field" placeholder="제목을 입력해주세요." required>

        <!-- Content -->
        <textarea name="content" class="input-field textarea" placeholder="내용을 입력하세요..." required></textarea>

        <!-- Image Upload -->
        <label class="file-upload">
            <input type="file" name="image" accept="image/*">
            📷 이미지 업로드
        </label>

        <!-- Submit Button -->
        <div class="submit-wrapper">
            <button type="submit" class="btn-submit">등록</button>
        </div>

    </form>
</div>
{% endblock %}
